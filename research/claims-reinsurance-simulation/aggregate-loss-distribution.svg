  <title id="fig2-title">Gross vs. Net Aggregate Annual Portfolio Loss Distribution (10,000 simulations)</title>
  <desc id="fig2-desc">Overlaid histogram and density comparison of 10,000 simulated annual aggregate claim totals before and after an individual Excess of Loss treaty with R150,000 retention, showing 99.5% VaR dropping from R9.65m to R6.12m.</desc>
  <text x="88" y="28" font-size="15" font-weight="700" fill="#0d2742">Aggregate Annual Claims Distribution: Gross vs. Net of Individual XoL (10,000 Years)</text>
  <text x="88" y="46" font-size="12" fill="#5d6c78">99.5% VaR (1-in-200 solvency benchmark) reduces from R9.65m (Gross) to R6.12m (Net) · 55% tail capital relief</text>
